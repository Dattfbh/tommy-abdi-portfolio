<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      rect { fill: #12131A; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64"/>
  
  <!-- Gear -->
  <g transform="translate(20, 32)">
    <!-- Gear teeth -->
    <circle cx="8" cy="0" r="2.5" fill="#FF7A45"/>
    <circle cx="8" cy="0" r="1.5" fill="#12131A"/>
    <polygon points="8,0 11,2 13,0 11,-2" fill="#FF7A45"/>
    
    <circle cx="5.6" cy="7.2" r="2.5" fill="#FF7A45"/>
    <polygon points="5.6,7.2 7.2,10 9.2,9 7.6,6.2" fill="#FF7A45"/>
    
    <circle cx="-2.8" cy="9.2" r="2.5" fill="#FF7A45"/>
    <polygon points="-2.8,9.2 -1,12 1.2,10.8 -0.8,7.6" fill="#FF7A45"/>
    
    <circle cx="-9.2" cy="5.6" r="2.5" fill="#FF7A45"/>
    <polygon points="-9.2,5.6 -7.2,7.6 -5,6 -7.2,3.8" fill="#FF7A45"/>
    
    <circle cx="-11" cy="-2" r="2.5" fill="#FF7A45"/>
    <polygon points="-11,-2 -8.8,-1 -7.2,-3.2 -9.4,-4.2" fill="#FF7A45"/>
    
    <circle cx="-7.2" cy="-9.2" r="2.5" fill="#FF7A45"/>
    <polygon points="-7.2,-9.2 -5,-8.2 -3.2,-10.8 -5.2,-11.8" fill="#FF7A45"/>
    
    <circle cx="0" cy="-11" r="2.5" fill="#FF7A45"/>
    <polygon points="0,-11 2.2,-9.8 3.6,-12.4 1.2,-13.4" fill="#FF7A45"/>
    
    <circle cx="8" cy="-8.4" r="2.5" fill="#FF7A45"/>
    <polygon points="8,-8.4 10,-6.8 12,-8.8 10,-10.4" fill="#FF7A45"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="6.5" fill="none" stroke="#FF7A45" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#FF7A45" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="1.5" fill="#FF7A45"/>
  </g>
  
  <!-- Circuit lines extending right -->
  <g stroke="#FF7A45" stroke-width="1.2" fill="none" stroke-linecap="round">
    <!-- Top line -->
    <path d="M 32 14 L 38 14 L 42 14 L 44 14"/>
    <circle cx="44" cy="14" r="1.8" fill="#FF7A45"/>
    
    <!-- Upper mid line -->
    <path d="M 32 22 L 38 22 L 42 22 L 44 22"/>
    <circle cx="44" cy="22" r="1.8" fill="#FF7A45"/>
    
    <!-- Middle line -->
    <path d="M 32 32 L 40 32 L 44 32"/>
    <circle cx="44" cy="32" r="1.8" fill="#FF7A45"/>
    
    <!-- Lower mid line -->
    <path d="M 32 42 L 38 42 L 42 42 L 44 42"/>
    <circle cx="44" cy="42" r="1.8" fill="#FF7A45"/>
    
    <!-- Bottom line -->
    <path d="M 32 50 L 38 50 L 42 50 L 44 50"/>
    <circle cx="44" cy="50" r="1.8" fill="#FF7A45"/>
  </g>
</svg>